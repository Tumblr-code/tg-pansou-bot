services:
  tg-pansou-bot:
    build: .
    container_name: tg-pansou-bot
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      DATA_DIR: /data
      DROP_PENDING_UPDATES: "false"
    volumes:
      - ./data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: host
